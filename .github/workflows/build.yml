name: Build and Release

on:
  push:
    branches: [main, master]
    # Pushed by release.yml when a changesets version PR merges
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: darwin

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Import Apple Certificate
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        # if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create the keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sign with the identity the certificate carries, so the team follows APPLE_CERTIFICATE alone
          APPLE_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$APPLE_IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application identity"
            exit 1
          fi
          # Masked in logs, as it was when it came from a secret
          echo "::add-mask::$APPLE_IDENTITY"
          echo "APPLE_IDENTITY=$APPLE_IDENTITY" >> "$GITHUB_ENV"

          # Clean up
          rm $RUNNER_TEMP/certificate.p12

      - name: Prepare Apple API Key
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        # if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Debug Build Environment
        if: matrix.os == 'macos-latest'
        run: npx tsx scripts/debug-build-env.ts
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build application (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm make
        env:
          NODE_ENV: production
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build application (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm make
        env:
          NODE_ENV: development

      - name: Sign Windows binaries with Trusted Signing
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: out/make/squirrel.windows/x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Release files for the github-release job, which publishes the release
      # with all of them attached at once: releases are immutable once published.
      - name: Upload release files (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-win
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES

      - name: Upload release files (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin
          if-no-files-found: error
          path: |
            out/make/zip/darwin/**/*.zip
            out/make/zip/darwin/**/RELEASES.json

      - name: Upload release files (Linux)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm

      - name: Upload artifacts for debugging (Windows)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: build-win-${{ github.sha }}
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          retention-days: 7

      - name: Upload artifacts for debugging (macOS)
        if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: build-darwin-${{ github.sha }}
          path: out/make/zip/darwin/**/*.zip
          retention-days: 7

      - name: Upload artifacts for debugging (Linux)
        if: matrix.os == 'ubuntu-latest' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-${{ github.sha }}
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
          retention-days: 7

  # The only job with write access. It publishes the release with the CHANGELOG
  # notes and every installer attached at once, since releases are immutable
  # once published.
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release with its installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh .github/scripts/changelog-section.sh CHANGELOG.md "${TAG#v}" > notes.md
          # An immutable release can't take a file later, so refuse to publish without every kind of installer.
          for pattern in '*.exe' '*.nupkg' 'RELEASES' '*.zip' 'RELEASES.json' '*.deb' '*.rpm'; do
            if [ -z "$(find dist -type f -name "$pattern")" ]; then
              echo "::error::No $pattern to attach"
              exit 1
            fi
          done
          # Files sit in per-arch folders and have spaces in their names.
          find dist -type f -print0 | xargs -0 sh .github/scripts/publish-release.sh "$TAG" notes.md
